{% extends "base.html" %}
{% block body_class %}auth{% endblock %}
{% block layout %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">PR</span>Paper Review</div>
  <div class="card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to manage submissions and reviews.</p>
    {% if msg %}<div class="flash ok">{{ msg }}</div>{% endif %}
    {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
    <form method="post" action="/login">
      <label>Email <input type="email" name="email" autocomplete="username" required autofocus></label>
      <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
      <button type="submit" class="block">Log in</button>
    </form>
  </div>
  <p class="auth-foot">New author? <a href="/register">Create an account</a></p>
</div>
{% endblock %}
