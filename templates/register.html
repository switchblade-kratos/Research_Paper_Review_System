{% extends "base.html" %}
{% block body_class %}auth{% endblock %}
{% block layout %}
<div class="auth-card">
  <div class="brand"><span class="brand-mark">PR</span>Paper Review</div>
  <div class="card">
    <h1>Create an author account</h1>
    <p class="sub">Reviewer and admin accounts are created by an admin.</p>
    {% if err %}<div class="flash err">{{ err }}</div>{% endif %}
    <form method="post" action="/register">
      <label>Full name <input name="full_name" required autofocus></label>
      <label>Email <input type="email" name="email" required></label>
      <label>Password <input type="password" name="password" minlength="6" required></label>
      <button type="submit" class="block">Sign up</button>
    </form>
  </div>
  <p class="auth-foot">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
